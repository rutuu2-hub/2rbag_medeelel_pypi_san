[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "2r_bag_medeelel-tools"
version = "0.1.0"
description = "Simple statistics and charts for learning Python"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib", "seaborn"]
readme = "README.md"

[tool.setuptools]
packages = ["medeelel_tools"]
